    - title: "Precios y tiempos"
      questions:
        - label: "¿Cuánto cuesta un proyecto?"
          content: |
            Depende del alcance, complejidad técnica e integraciones. Los proyectos suelen iniciar en auditorías especializadas y escalar a implementaciones completas.
        - label: "¿Cuáles son tus términos de pago?"
          content: |
            Suelo trabajar con un anticipo para reservar la agenda y el pago restante al entregar.
        - label: "¿Cuánto tarda un proyecto?"
          content: |
            Los tiempos dependen del alcance. Proyectos pequeños pueden tomar semanas y plataformas más grandes requieren múltiples fases.
        - label: "¿Ofreces soporte continuo?"
          content: |
            Sí. También trabajo por retainer mensual para equipos que necesitan desarrollo y mantenimiento continuo.
