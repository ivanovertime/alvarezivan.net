    - title: "Precios y tiempos"
      questions:
        - label: "¿Cuánto cuesta un proyecto típicamente?"
          content: |
            Los costos varían según el alcance, la complejidad técnica y los sistemas involucrados. Las auditorías técnicas especializadas u optimizaciones inician en $800. La mayoría de los desarrollos de plataformas completas se ubican entre $2.500 y $8.000. Para soporte continuo, automatización DevOps o consultoría a corto plazo, ofrezco tarifas competitivas por hora o por jornada.
        - label: "¿Cuáles son tus términos de pago?"
          content: |
            Generalmente solicito un 40% de anticipo para reservar la agenda e iniciar el trabajo, con el 60% restante contra entrega. Acepto pagos vía transferencia bancaria o PayPal.
        - label: "¿Cuánto tarda un proyecto típico?"
          content: |
            Los tiempos dependen del alcance y las integraciones. Proyectos enfocados toman entre **2 y 4 semanas**, mientras que plataformas más amplias requieren entre **6 y 12 semanas**. Entrego un cronograma detallado tras la fase de descubrimiento.
        - label: "¿Ofreces soporte continuo o retainers?"
          content: |
            Sí. Para equipos que necesitan desarrollo continuo de funcionalidades, mantenimiento o rendimiento, ofrezco retainers mensuales adaptados al alcance y tiempo de respuesta.
