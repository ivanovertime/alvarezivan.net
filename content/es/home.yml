            - BigQuery
    - title: "Precios y tiempos"
      questions:
        - label: "Cuanto cuesta un proyecto?"
          content: |
            Depende del alcance, complejidad tecnica e integraciones. Los proyectos suelen iniciar en auditorias especializadas y escalar a implementaciones completas.
        - label: "Cuales son tus terminos de pago?"
          content: |
            Suelo trabajar con un anticipo para reservar la agenda y el pago restante al entregar.
        - label: "Cuanto tarda un proyecto?"
          content: |
            Los tiempos dependen del alcance. Proyectos pequenos pueden tomar semanas y plataformas mas grandes requieren multiples fases.
        - label: "Ofreces soporte continuo?"
          content: |
            Si. Tambien trabajo por retainer mensual para equipos que necesitan desarrollo y mantenimiento continuo.
