about:
  title: "Sobre mí"
  description: |
    Construyo las plataformas internas sobre las que trabaja el equipo — back offices, sistemas de diseño y el tooling que los rodea. Antes, cuatro años en plataformas que otros abandonaron: tiendas e-commerce bajo carga, integraciones SAP con documentación perdida, despliegues que nadie quería tocar. Leer el código, arreglar la cosa y dejar al equipo mejor de como lo encontré.
