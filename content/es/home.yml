about:
  title: "Sobre mí"
  description: |
    Construyo las plataformas internas sobre las que trabaja el equipo — back offices, sistemas de diseño y el tooling que los rodea. Cuento con más de cinco años de experiencia en plataformas en producción: tiendas e-commerce bajo alta concurrencia, integraciones con SAP con documentación escasa y despliegues críticos. Leer el código, resolver los cuellos de botella y dejar al equipo y al sistema en mejor estado de como los encontré.
