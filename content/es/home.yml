about:
  title: "Sobre mí"
  description: |
    En los últimos años he trabajado en plataformas que otros abandonaron — tiendas e-commerce bajo carga, integraciones SAP con documentación perdida, despliegues que nadie quería tocar. Mi trabajo es entrar, leer el código, arreglarlo y dejar al equipo mejor de como lo encontré.
