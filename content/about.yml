title: About
description: Information Engineer from Valencia, Venezuela.
content: |
  Hi, I'm an Information Engineer and Full Stack Developer based in Valencia, Venezuela.

  I specialize in building scalable web applications and robust data solutions. As a versatile engineer, I enjoy wearing many hats—navigating the entire stack from backend architecture to frontend performance. I have deep hands-on experience with composable commerce solutions and thrive on solving complex technical challenges.

  Beyond code, I am curious by nature. You'll often find me exploring cinema, cooking, or broadening my perspectives through Japanese language and culture.

