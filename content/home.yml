    - title: Pricing & Timelines
      questions:
        - label: How much does a project typically cost?
          content: |
            Costs vary based on scope, technical complexity, and the systems involved. Target engineering engagements start at $800 for specialized technical audits or optimizations. Most end-to-end platform builds land between $2,500 and $8,000. For ongoing platform support, DevOps automation, or short-term advisory work, I offer competitive hourly and day-rate consulting.
        - label: What are your payment terms?
          content: |
            I generally require a 40% deposit to schedule the project and begin work, with the remaining 60% due upon delivery. I accept payments via bank transfer or PayPal.
        - label: How long does a typical project take?
          content: |
            Timelines depend on scope and integrations. Smaller projects take **2–4 weeks**, while larger platforms range **6–12 weeks**. I provide a detailed timeline after discovery.
        - label: Do you offer retainers or ongoing support?
          content: |
            Yes. For teams that need ongoing feature development, maintenance, or performance work, I offer monthly retainers tailored to scope and response time.
